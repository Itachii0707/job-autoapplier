services:
  # Backend Web Service (FastAPI + Playwright Docker container)
  - type: web
    name: ai-job-autoapplier-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8000
      - key: HEADLESS
        value: "true"
      - key: DATABASE_URL
        value: sqlite:///./app.db
      - key: LLM_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_API_KEY
        sync: false

  # Frontend Static Site
  - type: web
    name: ai-job-autoapplier-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-job-autoapplier-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///./data/app.db
      - HEADLESS=true
      - USER_DATA_DIR=/app/user_data
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ./data:/app/data
      - ./user_data:/app/user_data
      - ./uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
